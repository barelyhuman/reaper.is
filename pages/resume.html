<main class="flex flex-col gap-4 leading-relaxed">
  <style>
    hr {
      border-color: var(--gray-5);
      width: 100%;
    }
    .card-wrapper {
      margin-top: 50px;
    }
    .card {
      break-inside: avoid;
      margin: 10px 0px;
      padding: 8px 0px;
      border-radius: 10px;
      margin-bottom: 22px;
    }
    .card .about {
      color: var(--gray-4);
    }
    .card .about ul {
      margin: 0;
      padding-left: 1.25rem;
    }
    .card .footer {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--light);
      flex-wrap: wrap;
    }
    .card .footer :nth-child(1):last-child::before {
      content: '•';
      text-decoration: none;
      height: 100%;
      margin-right: 10px;
      color: var(--light);
      font-size: 15px;
    }
    .card .links-group {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }
    .card .role {
      color: var(--gray-5);
      display: flex;
      align-items: center;
      height: 100%;
    }
    .card .links-group .link-item {
      transition: color 250ms ease-out;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .card .links-group .link-item:hover {
      cursor: pointer;
    }

    @media print {
      @page {
        font-size: 12px;
        size: portrait;
        margin: 3mm;
        background: #fff;
        color: #343a40;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      #themer,
      .backlink,
      .header-block,
      .note {
        display: none;
      }

      .card-wrapper {
        margin-top: 10px;
      }

      .card {
        margin-bottom: 10px;
      }
    }
  </style>
  <section>
    <h1>Siddharth Gelera</h1>
    <p>
      Developer and Open Source Enthusiast specialising in web and tooling
      development
    </p>
  </section>
  <hr />
  <section class="card-wrapper side-projects">
    <h2 id="side-projects">Side Projects</h2>
    <div>${side_project_cards}</div>
  </section>
  <hr />
  <section class="card-wrapper work">
    <h2 id="work-experience">Work Experience</h2>
    <div>${work_cards}</div>
  </section>
  <div>
    <div class="p-3 rounded-md border text-gray border-gray note">
      <h6 class="text-accent">Tip:</h6>
      <p>This page is print media friendly</p>
    </div>
  </div>
</main>
