<main class="resume-page flex flex-col gap-4 leading-relaxed">
  <style>
    hr {
      border-color: var(--gray-5);
      width: 100%;
    }
    .card-wrapper {
      margin-top: 50px;
    }
    .card {
      break-inside: avoid;
      margin: 10px 0px;
      padding: 8px 0px;
      border-radius: 10px;
      margin-bottom: 22px;
    }
    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem 1rem;
      margin-bottom: 0.35rem;
    }
    .card .about {
      color: var(--gray-4);
    }
    .card .about ul {
      margin: 0;
      padding-left: 1.25rem;
    }
    .card .links-group {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .card .role {
      color: var(--gray-5);
    }
    .card .links-group .link-item {
      transition: color 250ms ease-out;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .card .links-group .link-item:hover {
      cursor: pointer;
    }

    @media print {
      @page {
        size: portrait;
        margin: 8mm;
      }

      html,
      body {
        display: block !important;
        min-height: auto !important;
        font-size: 10px !important;
        line-height: 1.3 !important;
      }

      body > div {
        padding: 0 !important;
        gap: 0 !important;
        max-width: 100% !important;
        font-size: 10px !important;
        line-height: 1.3 !important;
      }

      #themer,
      .backlink,
      .header-block,
      .note,
      hr,
      .links-group {
        display: none !important;
      }

      .resume-page {
        gap: 0.35rem !important;
        line-height: 1.3 !important;
      }

      .resume-page > section:first-of-type {
        margin-bottom: 0.15rem;
      }

      .resume-page h1 {
        font-size: 1.35rem;
        margin: 0;
        line-height: 1.2;
      }

      .resume-page > section:first-of-type p {
        margin: 0.15rem 0 0;
        font-size: 0.95em;
      }

      .card-wrapper {
        margin-top: 0.35rem;
      }

      .card-wrapper h2 {
        font-size: 1rem;
        margin: 0.2rem 0 0.15rem;
        line-height: 1.2;
      }

      .card {
        break-inside: auto;
        margin: 0.1rem 0;
        padding: 0;
        margin-bottom: 0.25rem;
      }

      .card-header {
        display: block;
        margin-bottom: 0.05rem;
      }

      .card h3 {
        font-size: 0.95rem;
        margin: 0;
        line-height: 1.2;
        display: inline;
      }

      .card .role {
        font-size: 0.85em;
        display: inline;
      }

      .card .role::before {
        content: ' · ';
      }

      .card .about {
        font-size: 0.9em;
        margin-top: 0.05rem;
      }

      .card .about ul {
        padding-left: 0.95rem;
        margin: 0.05rem 0 0;
      }

      .card .about li {
        margin: 0;
        padding: 0;
      }

      .card .about li + li {
        margin-top: 0.05rem;
      }

      .side-projects > div {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 0.75rem;
        row-gap: 0.1rem;
      }

      .side-projects .card h3 {
        display: block;
      }

      .side-projects .card .about {
        margin-top: 0;
      }
    }
  </style>
  <section>
    <h1>Siddharth Gelera</h1>
    <p>
      Developer and Open Source Enthusiast specialising in web and tooling
      development
    </p>
  </section>
  <hr />
  <section class="card-wrapper side-projects">
    <h2 id="side-projects">Side Projects</h2>
    <div>${side_project_cards}</div>
  </section>
  <hr />
  <section class="card-wrapper work">
    <h2 id="work-experience">Work Experience</h2>
    <div>${work_cards}</div>
  </section>
  <div>
    <div class="p-3 rounded-md border text-gray border-gray note">
      <h6 class="text-accent">Tip:</h6>
      <p>This page is print media friendly</p>
    </div>
  </div>
</main>
